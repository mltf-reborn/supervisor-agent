spring.application.name=supervisor-agent

# Google Cloud Spanner Configuration
gcp.spanner.project-id=${GCP_PROJECT_ID:mltf-506212}
gcp.spanner.instance-id=${GCP_SPANNER_INSTANCE_ID:mltf-spanner}
gcp.spanner.database-id=${GCP_SPANNER_DATABASE_ID:mortgage_db}
gcp.spanner.emulator-host=${SPANNER_EMULATOR_HOST:}

# Google Cloud Storage Configuration (configurable per environment / PROD)
gcp.storage.project-id=${GCP_PROJECT_ID:mltf-506212}
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET_NAME:mltf-bucket}

# Import local secrets if present
spring.config.import=optional:classpath:application-secret.properties

# Google Gemini & ADK Configuration
google.gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
google.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
google.gemini.project-id=${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT_ID:mltf-506212}}
google.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}
google.gemini.use-vertex-ai=${GOOGLE_GENAI_USE_VERTEXAI:false}
google.gemini.temperature=0.1
google.gemini.timeout-seconds=120

# External Worker Services Configuration
services.document-processing.base-url=${DOCUMENT_PROCESSING_URL:http://localhost:8081}
services.external-kyc.base-url=${EXTERNAL_KYC_URL:http://localhost:8080}
services.case-management.base-url=${CASE_MANAGEMENT_URL:http://localhost:8082}
google.gemini.case-management-url=${CASE_MANAGEMENT_URL:http://localhost:8082}
google.gemini.document-processing-url=${DOCUMENT_PROCESSING_URL:http://localhost:8081}
google.gemini.external-kyc-url=${EXTERNAL_KYC_URL:http://localhost:8080}

# Actuator & Probes for Kubernetes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always


