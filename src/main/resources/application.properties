spring.application.name=supervisor-agent

# Google Cloud Spanner Configuration
gcp.spanner.project-id=${GCP_PROJECT_ID:mltf-506212}
gcp.spanner.instance-id=${GCP_SPANNER_INSTANCE_ID:mltf-spanner}
gcp.spanner.database-id=${GCP_SPANNER_DATABASE_ID:mortgage_db}
gcp.spanner.emulator-host=${SPANNER_EMULATOR_HOST:}

# Google Cloud Storage Configuration (configurable per environment / PROD)
gcp.storage.project-id=${GCP_PROJECT_ID:mltf-506212}
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET_NAME:mltf-bucket}

# Actuator & Probes for Kubernetes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

